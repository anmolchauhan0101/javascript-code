<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Document Object Model</h3>
    <script>
        //alert method used to show pop-up message on webpage
        alert("Hello World");

        //prompt method used to show pop-up message on webpage and take input from user
        prompt("What is your name?");

        //confirm method used to show pop-up message on webpage and take input from user
        confirm("Are you sure you want to delete this file?");

        //difference between above three methods is that alert method only shows message, prompt method shows message and takes input from user, confirm method shows message and takes input from user in form of yes or no.
        

         


    </script>
</body>
</html>
